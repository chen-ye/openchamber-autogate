<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AutoGate</title>
    <style>
      :root {
        color-scheme: dark light;
        font-family: var(--font-sans, var(--oc-font, system-ui, -apple-system, sans-serif));
        color: var(--surface-foreground, var(--oc-fg, inherit));
        background: transparent;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow-x: hidden;
      }
      #root {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      /* Work Status surface */
      .ag-status-root {
        display: flex;
        flex-direction: column;
        gap: 0.375rem;
        min-width: 0;
      }
      .ag-controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.25rem;
        min-width: 0;
      }
      .ag-pill {
        appearance: none;
        border: 1px solid var(--interactive-border, var(--oc-border, rgba(128, 128, 128, 0.22)));
        background: var(--surface-muted, var(--oc-muted-surface, rgba(128, 128, 128, 0.08)));
        color: var(--surface-foreground, var(--oc-fg, inherit));
        font: inherit;
        font-size: 0.6875rem;
        font-weight: 500;
        line-height: 1.2;
        padding: 0.1875rem 0.4375rem;
        border-radius: 9999px;
        display: inline-flex;
        align-items: center;
        gap: 0.3125rem;
        white-space: nowrap;
        max-width: 100%;
      }
      button.ag-pill {
        cursor: pointer;
        transition: background-color 120ms ease, border-color 120ms ease;
      }
      button.ag-pill:hover:not(:disabled) {
        background: var(--interactive-hover, var(--oc-hover, rgba(128, 128, 128, 0.14)));
      }
      button.ag-pill:focus-visible {
        outline: 1.5px solid var(--interactive-focus-ring, var(--oc-focus, var(--oc-primary, #4f86f7)));
        outline-offset: 1px;
      }
      button.ag-pill:disabled {
        opacity: 0.55;
        cursor: default;
      }
      .ag-pill[data-tone="success"] {
        border-color: color-mix(in srgb, var(--status-success, var(--oc-success, #2fb375)) 35%, transparent);
        background: color-mix(in srgb, var(--status-success, var(--oc-success, #2fb375)) 12%, transparent);
        color: var(--success-text, var(--oc-success-text, var(--oc-success, #2fb375)));
      }
      .ag-pill[data-tone="warning"] {
        border-color: color-mix(in srgb, var(--status-warning, var(--oc-warning, #e59934)) 35%, transparent);
        background: color-mix(in srgb, var(--status-warning, var(--oc-warning, #e59934)) 12%, transparent);
        color: var(--warning-text, var(--oc-warning-text, var(--oc-warning, #e59934)));
      }
      .ag-pill[data-tone="error"] {
        border-color: color-mix(in srgb, var(--status-error, var(--oc-error, #e55353)) 35%, transparent);
        background: color-mix(in srgb, var(--status-error, var(--oc-error, #e55353)) 12%, transparent);
        color: var(--error-text, var(--oc-error-text, var(--oc-error, #e55353)));
      }
      .ag-pill[data-tone="muted"] {
        color: var(--surface-muted-foreground, var(--oc-muted, rgba(128, 128, 128, 0.85)));
      }
      .ag-stats-summary {
        font-size: 0.6875rem;
        line-height: 1.25;
        font-variant-numeric: tabular-nums;
        color: var(--surface-muted-foreground, var(--oc-muted, rgba(128, 128, 128, 0.85)));
        padding: 0 0.125rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .ag-note {
        margin: 0;
        padding: 0.25rem;
        min-height: 1.75rem;
        display: flex;
        align-items: center;
        font-size: 0.78125rem;
        line-height: 1.3;
        color: var(--surface-muted-foreground, var(--oc-muted, rgba(128, 128, 128, 0.85)));
      }
      .ag-note[data-tone="warning"] {
        color: var(--warning-text, var(--oc-warning-text, var(--oc-warning, #d97706)));
      }

      /* Recent sessions list */
      .ag-sessions-section {
        display: flex;
        flex-direction: column;
        gap: 0.125rem;
        padding-top: 0.25rem;
        border-top: 1px solid color-mix(in srgb, var(--interactive-border, var(--oc-border, rgba(128, 128, 128, 0.22))) 65%, transparent);
        min-width: 0;
      }
      .ag-section-label {
        font-size: 0.6875rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--surface-muted-foreground, var(--oc-muted, rgba(128, 128, 128, 0.85)));
        padding: 0 0.25rem 0.0625rem;
      }
      .ag-sessions-list {
        display: flex;
        flex-direction: column;
        gap: 0.125rem;
        min-width: 0;
      }
      .ag-row-group {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .ag-row {
        appearance: none;
        border: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
        width: 100%;
        padding: 0.25rem 0.25rem;
        border-radius: calc(var(--radius, var(--oc-radius, 0.375rem)) - 2px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        cursor: pointer;
        transition: background-color 120ms ease;
        min-width: 0;
      }
      .ag-row:hover,
      .ag-row[data-oc-popover-open="true"] {
        background: var(--interactive-hover, var(--oc-hover, rgba(128, 128, 128, 0.1)));
      }
      .ag-row:focus-visible {
        outline: 1.5px solid var(--interactive-focus-ring, var(--oc-focus, var(--oc-primary, #4f86f7)));
        outline-offset: -1.5px;
      }
      .ag-row-main {
        display: flex;
        flex-direction: column;
        gap: 0.0625rem;
        min-width: 0;
        flex: 1 1 auto;
      }
      .ag-row-top {
        display: flex;
        align-items: center;
        gap: 0.375rem;
        min-width: 0;
      }
      .ag-dot {
        width: 0.4375rem;
        height: 0.4375rem;
        border-radius: 9999px;
        flex-shrink: 0;
        background: var(--status-success, var(--oc-success, #2fb375));
      }
      .ag-dot[data-tone="warning"] {
        background: var(--status-warning, var(--oc-warning, #e59934));
      }
      .ag-dot[data-tone="error"] {
        background: var(--status-error, var(--oc-error, #e55353));
      }
      .ag-dot[data-tone="info"] {
        background: var(--status-info, var(--oc-info, #4c9aff));
        animation: ag-pulse 1.2s ease-in-out infinite;
      }
      .ag-dot[data-tone="muted"] {
        background: var(--surface-muted-foreground, var(--oc-muted, rgba(128, 128, 128, 0.6)));
      }
      @keyframes ag-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      .ag-session-title {
        font-size: 0.78125rem;
        font-weight: 500;
        line-height: 1.25;
        color: var(--surface-foreground, var(--oc-fg, inherit));
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
      }
      .ag-row-sub {
        font-family: var(--font-mono, var(--oc-mono, ui-monospace, monospace));
        font-size: 0.6875rem;
        line-height: 1.25;
        color: var(--surface-muted-foreground, var(--oc-muted, rgba(128, 128, 128, 0.85)));
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        padding-left: 0.8125rem;
        min-width: 0;
      }
      .ag-row-right {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 0.0625rem;
        flex-shrink: 0;
      }
      .ag-session-counts {
        font-size: 0.6875rem;
        line-height: 1.25;
        font-variant-numeric: tabular-nums;
        color: var(--surface-muted-foreground, var(--oc-muted, rgba(128, 128, 128, 0.85)));
        white-space: nowrap;
      }
      .ag-session-counts[data-has-block="true"] {
        color: var(--error-text, var(--oc-error-text, var(--oc-error, #e55353)));
      }
      .ag-age {
        font-size: 0.6875rem;
        line-height: 1.2;
        font-variant-numeric: tabular-nums;
        color: var(--surface-muted-foreground, var(--oc-muted, rgba(128, 128, 128, 0.78)));
        white-space: nowrap;
      }
      .ag-age[data-fresh="true"] {
        color: var(--info-text, var(--oc-info-text, var(--oc-info, #4c9aff)));
      }

      /* Inline fallback drawer when host popovers are unavailable */
      .ag-inline-detail {
        margin: 0.125rem 0.25rem 0.3125rem 0.75rem;
        padding: 0.5rem 0.625rem;
        border-radius: calc(var(--radius, var(--oc-radius, 0.375rem)) - 2px);
        background: var(--surface-muted, var(--oc-muted-surface, rgba(128, 128, 128, 0.08)));
        border: 1px solid var(--interactive-border, var(--oc-border, rgba(128, 128, 128, 0.18)));
        display: flex;
        flex-direction: column;
        gap: 0.4375rem;
        min-width: 0;
      }

      /* Popover surface */
      .ag-popover {
        padding: 0.625rem 0.75rem;
        display: flex;
        flex-direction: column;
        gap: 0.4375rem;
        background: var(--surface-elevated, var(--oc-elevated, transparent));
        min-width: 0;
        overflow-y: auto;
      }
      .ag-pop-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 0.5rem;
        min-width: 0;
      }
      .ag-pop-title-wrap {
        display: flex;
        flex-direction: column;
        gap: 0.0625rem;
        min-width: 0;
        flex: 1 1 auto;
      }
      .ag-pop-title {
        margin: 0;
        font-size: 0.84375rem;
        font-weight: 600;
        line-height: 1.25;
        word-break: break-word;
        min-width: 0;
      }
      .ag-pop-subtitle {
        font-family: var(--font-mono, var(--oc-mono, ui-monospace, monospace));
        font-size: 0.6875rem;
        line-height: 1.2;
        color: var(--surface-muted-foreground, var(--oc-muted, rgba(128, 128, 128, 0.85)));
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .ag-pop-summary {
        display: flex;
        flex-direction: column;
        gap: 0.1875rem;
        padding: 0.375rem 0.5rem;
        border-radius: calc(var(--radius, var(--oc-radius, 0.375rem)) - 2px);
        background: var(--surface-muted, var(--oc-muted-surface, rgba(128, 128, 128, 0.07)));
        border: 1px solid color-mix(in srgb, var(--interactive-border, var(--oc-border, rgba(128, 128, 128, 0.2))) 75%, transparent);
      }
      .ag-pop-summary-counts {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.75rem;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
      }
      .ag-count-allow {
        color: var(--success-text, var(--oc-success-text, var(--oc-success, #2fb375)));
      }
      .ag-count-block {
        color: var(--error-text, var(--oc-error-text, var(--oc-error, #e55353)));
      }
      .ag-count-unsure {
        color: var(--warning-text, var(--oc-warning-text, var(--oc-warning, #e59934)));
      }
      .ag-pop-summary-meta {
        font-size: 0.6875rem;
        font-variant-numeric: tabular-nums;
        color: var(--surface-muted-foreground, var(--oc-muted, rgba(128, 128, 128, 0.88)));
      }

      /* Evaluation mini-list inside popover */
      .ag-mini-list {
        display: flex;
        flex-direction: column;
        gap: 0.125rem;
        max-height: 7.75rem;
        overflow-y: auto;
        min-width: 0;
      }
      .ag-mini-row {
        appearance: none;
        border: 1px solid transparent;
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
        width: 100%;
        padding: 0.25rem 0.375rem;
        border-radius: calc(var(--radius, var(--oc-radius, 0.375rem)) - 3px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.375rem;
        cursor: pointer;
        min-width: 0;
      }
      .ag-mini-row:hover {
        background: var(--interactive-hover, var(--oc-hover, rgba(128, 128, 128, 0.1)));
      }
      .ag-mini-row[aria-selected="true"] {
        background: var(--interactive-selection, var(--oc-selection, rgba(91, 145, 255, 0.16)));
        color: var(--interactive-selection-foreground, var(--oc-selection-fg, inherit));
        border-color: color-mix(in srgb, var(--interactive-border, var(--oc-border, rgba(128, 128, 128, 0.25))) 85%, transparent);
      }
      .ag-mini-left {
        display: flex;
        align-items: center;
        gap: 0.375rem;
        min-width: 0;
        flex: 1 1 auto;
      }
      .ag-mini-cmd {
        font-family: var(--font-mono, var(--oc-mono, ui-monospace, monospace));
        font-size: 0.71875rem;
        line-height: 1.3;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
      }
      .ag-mini-meta {
        font-size: 0.6875rem;
        font-variant-numeric: tabular-nums;
        color: var(--surface-muted-foreground, var(--oc-muted, rgba(128, 128, 128, 0.85)));
        white-space: nowrap;
        flex-shrink: 0;
      }

      /* Selected evaluation detail */
      .ag-eval-detail {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        padding-top: 0.3125rem;
        border-top: 1px solid color-mix(in srgb, var(--interactive-border, var(--oc-border, rgba(128, 128, 128, 0.2))) 70%, transparent);
        min-width: 0;
      }
      .ag-eval-badges {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.25rem;
        min-width: 0;
      }
      .ag-eval-badges .oc-sdk-badge {
        display: inline-block;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        vertical-align: middle;
      }
      .ag-eval-meta {
        font-size: 0.6875rem;
        font-variant-numeric: tabular-nums;
        color: var(--surface-muted-foreground, var(--oc-muted, rgba(128, 128, 128, 0.85)));
      }
      .ag-field-label {
        font-size: 0.65625rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--surface-muted-foreground, var(--oc-muted, rgba(128, 128, 128, 0.85)));
      }
      .ag-code-box {
        margin: 0;
        max-height: 4.5rem;
        overflow-y: auto;
        padding: 0.3125rem 0.4375rem;
        border-radius: calc(var(--radius, var(--oc-radius, 0.375rem)) - 3px);
        background: var(--surface-muted, var(--oc-muted-surface, rgba(128, 128, 128, 0.08)));
        border: 1px solid var(--interactive-border, var(--oc-border, rgba(128, 128, 128, 0.16)));
        font-family: var(--font-mono, var(--oc-mono, ui-monospace, monospace));
        font-size: 0.6875rem;
        line-height: 1.35;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .ag-prose-box {
        margin: 0;
        font-size: 0.71875rem;
        line-height: 1.35;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .ag-cascade-line {
        font-family: var(--font-mono, var(--oc-mono, ui-monospace, monospace));
        font-size: 0.6875rem;
        color: var(--surface-muted-foreground, var(--oc-muted, rgba(128, 128, 128, 0.85)));
        line-height: 1.3;
        overflow-wrap: anywhere;
      }
      .ag-pop-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.375rem;
        padding-top: 0.125rem;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="./main.js"></script>
  </body>
</html>
